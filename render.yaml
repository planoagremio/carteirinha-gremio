services:
  - type: web
    name: gremio-acesso-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: AMBIENTE
        value: producao
      - key: DATABASE_URL
        fromDatabase:
          name: gremio-acesso-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: USUARIO
        sync: false
      - key: SENHA_HASH
        sync: false
      - key: USUARIO_RECEPCAO
        sync: false
      - key: SENHA_HASH_RECEPCAO
        sync: false
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: gremio-acesso-db
    databaseName: gremio_acesso
    user: gremio
